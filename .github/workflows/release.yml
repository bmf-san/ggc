name: GoReleaser

on:
  push:
    tags:
      - '*'
  # Manual / programmatic escape hatch. The normal path is `push: tags`,
  # which fires automatically because release-please now publishes its
  # release tag with a GitHub App installation token (the default
  # `GITHUB_TOKEN` would have been blocked from starting downstream
  # workflows). `workflow_call` stays available so the release can be
  # rebuilt for an existing tag without re-tagging.
  workflow_call:
    inputs:
      tag_name:
        description: 'Tag (e.g. v8.5.0) to build and release. Required when invoked via workflow_call.'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag (e.g. v8.5.0) to build and release.'
        required: true
        type: string

# Default the workflow token to no permissions and grant exactly what
# GoReleaser needs at the job level. Satisfies the Scorecard
# Token-Permissions check.
permissions: {}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for cosign keyless signing via GitHub's OIDC provider.
      id-token: write
      # Required to push container images to ghcr.io.
      packages: write
    strategy:
      matrix:
        go-version: [ '1.26.8' ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          fetch-depth: 0
          # When invoked from another workflow (release-please) or manually
          # via workflow_dispatch, ensure we check out the release tag so
          # GoReleaser sees the correct version. For tag pushes, GITHUB_REF
          # already points at the tag and the input is empty.
          ref: ${{ inputs.tag_name || github.ref }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Install Syft (SBOM)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
